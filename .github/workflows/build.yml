name: Build Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true

    - name: Prepare and Build
      run: |
        rm -rf habit_tracker
        unzip -q habit_tracker_source.zip
        cd habit_tracker
        
        # 1. Обновляем версию Android Gradle Plugin (AGP) с 9.1.0 на 9.1.1
        sed -i 's/version "9.1.0"/version "9.1.1"/g' android/settings.gradle.kts
        
        # 2. Обновляем версию Gradle с 9.3.1 на 9.5.0
        sed -i 's/gradle-9.3.1-all.zip/gradle-9.5.0-all.zip/g' android/gradle/wrapper/gradle-wrapper.properties
        
        # 3. Страховка от старого файла
        rm -f android/build.gradle
        
        flutter clean
        flutter pub get
        flutter build apk --release --split-per-abi -PdebugSignRelease=true

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: signed-apks
        path: '**/*release*.apk'
