name: Build Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true

    - name: Prepare and Build
      run: |
        ZIP_FILE=$(find . -name "*.zip" | head -n 1)
        echo "Найден архив: $ZIP_FILE"
        unzip -q "$ZIP_FILE"
        
        cd habit_tracker
        
        sed -i '/android.aapt2FromMavenOverride/d' android/gradle.properties
        sed -i '/android.enableResourceOptimizations/d' android/gradle.properties
        
        flutter clean
        flutter pub get
        flutter build apk --release --split-per-abi -PdebugSignRelease=true

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: signed-apks
        path: '**/*release*.apk'
