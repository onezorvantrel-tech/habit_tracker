name: Build Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true

    - name: Prepare and Build
      run: |
        # 1. Распаковываем твой архив
        unzip -q habit_tracker_source.zip
        
        # 2. Заходим в папку проекта
        cd habit_tracker
        
        # 3. Автоматически удаляем настройки Termux
        sed -i '/android.aapt2FromMavenOverride/d' android/gradle.properties
        sed -i '/android.enableResourceOptimizations/d' android/gradle.properties
        
        # 4. Собираем раздельные APK (для разных процессоров)
        flutter pub get
        flutter build apk --release --split-per-abi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-apks
        path: '**/*release*.apk'
