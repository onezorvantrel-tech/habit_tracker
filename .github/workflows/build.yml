name: Build Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true

    - name: Prepare and Build
      run: |
        # Если загружен ZIP-архив, распаковываем его
        if [ -f "habit_tracker_source.zip" ]; then
          echo "Распаковываем архив..."
          unzip -q habit_tracker_source.zip
        fi

        # Если есть папка habit_tracker, заходим в нее
        if [ -d "habit_tracker" ]; then
          echo "Переходим в папку проекта..."
          cd habit_tracker
        fi

        # Выполняем сборку
        flutter pub get
        flutter build apk --release --no-tree-shake-icons

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        # Ищем APK во всех вложенных папках (это 100% сработает)
        path: '**/app-release.apk'
